name: RylixManager Docker Build & Release

on:
  push:
    branches: [main, canary]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (Optional)
        if: "${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Version & Tags
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/dokploy/package.json').version")
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          GHCR_TAGS="ghcr.io/${REPO_LOWER}:latest,ghcr.io/${REPO_LOWER}:${VERSION}"
          
          if [ "${{ github.ref }}" = "refs/heads/canary" ]; then
            GHCR_TAGS="ghcr.io/${REPO_LOWER}:canary"
          fi
          
          # If Docker Hub credentials exist, add Docker Hub tags
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            GHCR_TAGS="${GHCR_TAGS},${{ secrets.DOCKERHUB_USERNAME }}/rylixmanager:latest,${{ secrets.DOCKERHUB_USERNAME }}/rylixmanager:${VERSION}"
          fi
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tags=${GHCR_TAGS}" >> $GITHUB_OUTPUT

      - name: Prepare Environment Files
        run: |
          if [ -f "apps/dokploy/.env.production.example" ]; then
            cp apps/dokploy/.env.production.example .env.production
            cp apps/dokploy/.env.production.example apps/dokploy/.env.production
          else
            touch .env.production
            touch apps/dokploy/.env.production
          fi

      - name: Build & Push Multi-Arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: "RylixManager ${{ steps.meta.outputs.version }} (Reimagined Dokploy)"
          body: |
            ## ⚡ RylixManager ${{ steps.meta.outputs.version }}
            
            Next-Gen VPS Platform, PaaS Orchestrator & Dedicated Game Server Control Panel.
            
            ### 🚀 One-Line Installation
            ```bash
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```
            
            ### 🗑️ One-Line Uninstallation
            ```bash
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/uninstall.sh | sh
            ```
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            install.sh
            uninstall.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
