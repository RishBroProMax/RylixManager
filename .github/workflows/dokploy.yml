name: RylixManager Docker Build & Release

on:
  push:
    branches: [main, canary]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME || 'imrishmika' }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract Version & Tags
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/dokploy/package.json').version")
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAGS="ghcr.io/${REPO_LOWER}:latest,ghcr.io/${REPO_LOWER}:${VERSION}"
          
          if [ "${{ github.ref }}" = "refs/heads/canary" ]; then
            TAGS="ghcr.io/${REPO_LOWER}:canary"
          fi
          
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            TAGS="${TAGS},${DOCKERHUB_USER}/rylixmanager:latest,${DOCKERHUB_USER}/rylixmanager:${VERSION}"
            if [ "${{ github.ref }}" = "refs/heads/canary" ]; then
              TAGS="${TAGS},${DOCKERHUB_USER}/rylixmanager:canary"
            fi
          fi
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Prepare Environment Files
        run: |
          if [ -f "apps/dokploy/.env.production.example" ]; then
            cp apps/dokploy/.env.production.example .env.production
            cp apps/dokploy/.env.production.example apps/dokploy/.env.production
          else
            touch .env.production
            touch apps/dokploy/.env.production
          fi

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "RylixManager ${{ steps.meta.outputs.version }} (Reimagined Dokploy)"
          make_latest: true
          body: |
            ## ⚡ RylixManager ${{ steps.meta.outputs.version }}
            
            Next-Gen VPS Platform, PaaS Orchestrator & Dedicated Game Server Control Panel.
            
            ### 🚀 One-Line Installation
            ```bash
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```
            
            ### 🗑️ One-Line Uninstallation
            ```bash
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/uninstall.sh | sh
            ```
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            install.sh
            uninstall.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
