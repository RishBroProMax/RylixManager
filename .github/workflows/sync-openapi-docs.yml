name: Generate and Update OpenAPI

on:
  push:
    branches:
      - canary
      - main
    paths:
      - 'apps/dokploy/server/api/routers/**'
      - 'packages/server/src/services/**'
      - 'packages/server/src/db/schema/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    name: Generate OpenAPI and commit to repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI specification
        run: |
          pnpm generate:openapi
          
          if [ ! -f openapi.json ]; then
            echo "❌ openapi.json not found"
            exit 1
          fi
          echo "✅ OpenAPI specification generated successfully"

      - name: Commit changes if openapi.json updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json
          git commit -m "chore: update openapi.json specification [skip ci]" || echo "No changes to commit"
          git push || echo "No remote changes to push"
