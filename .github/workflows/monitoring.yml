name: RylixManager Monitoring Docker Build

on:
  push:
    branches: [main, canary]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-monitoring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: "${{ secrets.DOCKERHUB_TOKEN != '' }}"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'imrishmika' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Tag
        id: meta
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME || 'imrishmika' }}
          HAS_DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG="latest"
          if [ "${{ github.ref }}" = "refs/heads/canary" ]; then
            TAG="canary"
          fi
          
          TAGS="ghcr.io/${REPO_LOWER}-monitoring:${TAG}"
          if [ "$HAS_DOCKER_TOKEN" = "true" ]; then
            TAGS="${TAGS},${DOCKERHUB_USER}/rylixmanager-monitoring:${TAG}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build & Push Monitoring Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.monitoring
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
