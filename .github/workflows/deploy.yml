name: Build Additional Images

on:
  push:
    branches: [main, canary]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-schedule-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tag and version
        id: meta-schedule
        run: |
          VERSION=$(jq -r .version apps/dokploy/package.json)
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG="latest"
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            TAG="canary"
          fi
          echo "tags=ghcr.io/${REPO_LOWER}-schedule:${TAG},ghcr.io/${REPO_LOWER}-schedule:${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push Schedule image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.schedule
          push: true
          tags: ${{ steps.meta-schedule.outputs.tags }}
          platforms: linux/amd64

  build-and-push-server-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tag and version
        id: meta-server
        run: |
          VERSION=$(jq -r .version apps/dokploy/package.json)
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG="latest"
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            TAG="canary"
          fi
          echo "tags=ghcr.io/${REPO_LOWER}-server:${TAG},ghcr.io/${REPO_LOWER}-server:${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push Server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.server
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          platforms: linux/amd64
