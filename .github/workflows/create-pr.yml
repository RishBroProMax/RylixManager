name: Auto PR to main when version changes

on:
  push:
    branches:
      - canary

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from package.json
        run: echo "VERSION=$(jq -r .version ./apps/dokploy/package.json)" >> $GITHUB_ENV

      - name: Get latest GitHub tag
        run: |
          LATEST_TAG=$(git ls-remote --tags origin | awk -F'/' '{print $3}' | sort -V | tail -n1)
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "$LATEST_TAG"

      - name: Compare versions
        run: |
          if [ "${{ env.VERSION }}" != "${{ env.LATEST_TAG }}" ]; then
            VERSION_CHANGED="true"
          else
            VERSION_CHANGED="false"
          fi
          echo "VERSION_CHANGED=$VERSION_CHANGED" >> $GITHUB_ENV

      - name: Check if a PR already exists
        run: |
          PR_EXISTS=$(gh pr list --state open --base main --head canary --json number --jq '. | length' 2>/dev/null || echo "0")
          echo "PR_EXISTS=$PR_EXISTS" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        if: env.VERSION_CHANGED == 'true' && env.PR_EXISTS == '0'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          gh pr create \
            --title "🚀 Release ${{ env.VERSION }}" \
            --body 'This PR promotes changes from `canary` to `main` for version ${{ env.VERSION }}.' \
            --base main \
            --head canary \
            --label "release" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
