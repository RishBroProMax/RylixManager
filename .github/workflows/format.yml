name: Code Format Check

on:
  push:
    branches: [main, canary]
  pull_request:
    branches: [main, canary]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: Run Biome Check
        run: biome check . || true
